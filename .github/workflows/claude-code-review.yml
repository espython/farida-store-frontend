name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request. Focus on:
            - Correctness bugs and logic errors
            - Security issues (injection, auth, secrets, OWASP top 10)
            - Simplification and reuse opportunities

            Use `gh pr comment` to leave a single top-level comment summarizing
            findings, ordered by severity. Use
            `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for specific line-level issues. Only post
            GitHub comments — don't just return the review as your final
            message. If nothing significant is wrong, say so briefly.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
